{% extends 'base.html' %}

{% block title %}水質圖表 - 水井村風雲客棧{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="d-flex flex-column flex-lg-row align-items-lg-end justify-content-between gap-3 mb-4">
        <div>
            <h1 class="display-5 fw-bold mb-2">智慧養殖水質圖表</h1>
            <p class="text-muted mb-0">查看魚塭水溫、pH、溶氧與鹽度變化，快速判斷養殖環境狀態。</p>
        </div>
        <div class="d-flex gap-2">
            <select id="pondSelect" class="form-select" aria-label="選擇魚塭">
                {% for pond in ponds %}
                <option value="{{ pond.id }}">{{ pond.name }} - {{ pond.species }}</option>
                {% endfor %}
            </select>
            <select id="daysSelect" class="form-select" aria-label="選擇天數">
                <option value="1">24 小時</option>
                <option value="7" selected>7 天</option>
                <option value="30">30 天</option>
            </select>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 fw-bold mb-0">水質趨勢</h2>
                    <span class="badge bg-primary" id="chartPondName">讀取中</span>
                </div>
                <canvas id="waterChart" height="120"></canvas>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card border-0 p-4 h-100">
                <h2 class="h5 fw-bold mb-3">最新狀態</h2>
                <div id="latestReading" class="vstack gap-3 text-muted">
                    <div>正在載入資料...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(() => {
    const pondSelect = document.getElementById('pondSelect');
    const daysSelect = document.getElementById('daysSelect');
    const chartPondName = document.getElementById('chartPondName');
    const latestReading = document.getElementById('latestReading');
    const chart = new Chart(document.getElementById('waterChart'), {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                { label: '水溫 C', data: [], borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,.12)', tension: .25 },
                { label: 'pH', data: [], borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.12)', tension: .25 },
                { label: '溶氧 mg/L', data: [], borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,.12)', tension: .25 },
                { label: '鹽度 ppt', data: [], borderColor: '#7c3aed', backgroundColor: 'rgba(124,58,237,.12)', tension: .25 },
            ],
        },
        options: {
            responsive: true,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { position: 'bottom' } },
            scales: { y: { beginAtZero: false } },
        },
    });

    function metric(label, value, unit, danger) {
        const color = danger ? 'text-danger' : 'text-dark';
        return `<div class="d-flex justify-content-between border-bottom pb-2"><span>${label}</span><strong class="${color}">${value ?? '-'} ${unit}</strong></div>`;
    }

    async function loadData() {
        if (!pondSelect.value) {
            latestReading.innerHTML = '<div>尚未建立魚塭資料。</div>';
            return;
        }
        const params = new URLSearchParams({ pond: pondSelect.value, days: daysSelect.value });
        const response = await fetch(`/api/water/history/?${params.toString()}`);
        const data = await response.json();
        const readings = data.readings || [];
        chartPondName.textContent = data.pond ? data.pond.name : '無資料';
        chart.data.labels = readings.map(item => item.measured_at);
        chart.data.datasets[0].data = readings.map(item => item.temperature);
        chart.data.datasets[1].data = readings.map(item => item.ph);
        chart.data.datasets[2].data = readings.map(item => item.dissolved_oxygen);
        chart.data.datasets[3].data = readings.map(item => item.salinity);
        chart.update();

        const latest = readings[readings.length - 1];
        if (!latest) {
            latestReading.innerHTML = '<div>這段期間沒有水質讀值。</div>';
            return;
        }
        latestReading.innerHTML = [
            `<div class="small text-muted">最後更新：${latest.measured_at}</div>`,
            metric('水溫', latest.temperature, 'C', latest.temperature > 32),
            metric('pH', latest.ph, '', latest.ph < 6.5 || latest.ph > 9),
            metric('溶氧', latest.dissolved_oxygen, 'mg/L', latest.dissolved_oxygen < 4),
            metric('鹽度', latest.salinity, 'ppt', false),
        ].join('');
    }

    pondSelect.addEventListener('change', loadData);
    daysSelect.addEventListener('change', loadData);
    loadData();
})();
</script>
{% endblock %}
